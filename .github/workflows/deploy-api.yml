name: Deploy API

# Deploys the Cloudflare Worker in server/ (the sync API). Runs when server/ changes, or by hand
# from the Actions tab. Needs one repository secret, CLOUDFLARE_API_TOKEN (Workers Scripts: Edit,
# D1: Edit, Account Settings: Read). The account id is in server/wrangler.toml.
on:
  workflow_dispatch:
  push:
    paths:
      - "server/**"
      - ".github/workflows/deploy-api.yml"

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Add the CLOUDFLARE_API_TOKEN secret to deploy the API from GitHub. Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Deploy the Worker
        if: steps.secrets.outputs.ready == 'true'
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.149.0 deploy
