name: Android check

# Builds the app and runs Android lint (including the NewApi check that keeps Android 5.1 working)
# whenever the app or its web UI changes. Releases are made by release.yml.
on:
  push:
    paths:
      - "app/**"
      - "web/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint and build (debug)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug assembleDebug
      - name: Show lint errors
        if: failure()
        run: grep -B1 -A4 "Error:" app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
      - name: Lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
