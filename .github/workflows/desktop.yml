name: Desktop build

# Builds the Windows app (Tauri) to check it compiles; the installer is kept as a run artifact.
# Releases are made by release.yml, which also builds this and attaches it to the GitHub release.
on:
  push:
    paths:
      - "desktop/**"
      - "web/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Build the web UI for desktop
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build:desktop

      - name: Build the Windows app
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: carrot-note-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
