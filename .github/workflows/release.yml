name: Release APK

# Push a tag like v1.0.1 to build a signed APK and publish it as a GitHub Release.
# The app checks the latest release and offers the update to users.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the web UI (TypeScript + CSS)
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Resolve version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.CARROT_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          CARROT_VERSION_NAME: ${{ steps.v.outputs.version }}
          CARROT_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          CARROT_KEYSTORE_PASSWORD: ${{ secrets.CARROT_KEYSTORE_PASSWORD }}
          CARROT_KEY_ALIAS: ${{ secrets.CARROT_KEY_ALIAS }}
          CARROT_KEY_PASSWORD: ${{ secrets.CARROT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "carrot-note-v${{ steps.v.outputs.version }}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "carrot-note-v$V.apk" --clobber
          else
            gh release create "v$V" "carrot-note-v$V.apk" --title "Carrot Note v$V" --generate-notes --target "${{ github.sha }}"
          fi

  windows:
    # The Windows app (Tauri), attached to the same release as the APK.
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Resolve version
        id: v
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build the web UI for desktop
        working-directory: web
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          node -e "const f='package.json',p=require('./'+f);p.version='${{ steps.v.outputs.version }}';require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
          npm run build:desktop

      - name: Build the Windows app
        working-directory: desktop
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          node -e "const f='src-tauri/tauri.conf.json',c=require('./'+f);c.version='${{ steps.v.outputs.version }}';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          npx tauri build

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          cp desktop/src-tauri/target/release/bundle/nsis/*.exe "carrot-note-v$V-windows-setup.exe"
          cp desktop/src-tauri/target/release/bundle/msi/*.msi "carrot-note-v$V-windows.msi"
          gh release upload "v$V" "carrot-note-v$V-windows-setup.exe" "carrot-note-v$V-windows.msi" --clobber
